    
enable_cilium: true
cluster_cidr: 10.42.0.0/16
service_cidr: 10.43.0.0/16
loadbalancer_cidr: 10.0.20.0/22

k3s_version: v1.35.4+k3s1
kubeconfig: ~/.kube/config-naquadah
api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
server_config_yaml: "{{ _config.server.default | combine(_config.server.cilium if enable_cilium else {}, recursive=True) }}"
agent_config_yaml: "{{ _config.agent.default | combine(_config.agent.cilium if enable_cilium else {}, recursive=True) }}"

_config:
  server:
    default:
      tls-san:
        - "{{ api_endpoint }}"
      disable:
        - traefik
      cluster-cidr: "{{ cluster_cidr }}"
      service-cidr: "{{ service_cidr }}"
    cilium:
      disable-kube-proxy: true
      disable-network-policy: true
      disable:
        - servicelb
      flannel-backend:
        - none
      node-taint:
        - node.cilium.io/agent-not-ready:NoExecute
  agent:
    default:
    cilium:
      node-taint:
        - node.cilium.io/agent-not-ready:NoExecute
