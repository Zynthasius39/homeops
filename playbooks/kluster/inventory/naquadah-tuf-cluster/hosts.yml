---
k3s_cluster:
  hosts:
    k8s-naquadah-1:
      ansible_host: 192.168.100.16
      ip: 192.168.100.16

    k8s-naquadah-2:
      ansible_host: 192.168.100.17
      ip: 192.168.100.17

    k8s-naquadah-3:
      ansible_host: 192.168.100.18
      ip: 192.168.100.18

  children:
    server:
      hosts:
        k8s-naquadah-1:
    agent:
      hosts:
        k8s-naquadah-2:
        k8s-naquadah-3:

  vars:
    ansible_user: almalinux
    ansible_python_interpreter: /usr/bin/python3.12
    ansible_ssh_private_key_file: ~/.ssh/keys/k8s-naquadah-tuf.pem
