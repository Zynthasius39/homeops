---
# Cilium Helm chart registry
cilium_chart_registry: oci://quay.io/cilium/charts/cilium

# Cilium Helm chart version
cilium_chart_version: 1.19.3

# Cilium namespace
cilium_namespace: kube-system

# Cilium Helm values
cilium_config: |
  autoDirectNodeRoutes: true
  bgpControlPlane:
    enabled: {{ cilium_bgp_enabled }}
  gatewayAPI:
    enabled: {{ cilium_gateway_api_enabled }}
  hostFirewall:
    enabled: {{ cilium_host_firewall }}
  {% if cilium_ingress_enabled %}
  ingressController:
    enabled: true
    loadbalancerMode: dedicated
    defaultSecretNamespace: kube-system
    defaultSecretName: argocd-server-cert
  {% endif %}
  ipam:
    mode: kubernetes
  ipv4NativeRoutingCIDR: {{ k3s_cluster_cidr }}
  k8sClientRateLimit:
    burst: {{ cilium_k8s_client_rate_limit.burst }}
    qps: {{ cilium_k8s_client_rate_limit.qps }}
  kubeProxyReplacement: "true"
  k8sServiceHost: {{ api_endpoint }}
  k8sServicePort: "6443"
  l2announcements:
    enabled: {{ cilium_l2_announcements_enabled }}
  routingMode: native
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_BIND_SERVICE
        - NET_RAW
        - IPC_LOCK
        - SYS_MODULE
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
        - SYSLOG
