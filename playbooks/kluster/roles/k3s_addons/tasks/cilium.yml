---
- name: Deploy Cilium via Helm
  kubernetes.core.helm:
    name: cilium
    chart_ref: "{{ cilium_chart_registry }}"
    release_namespace: "{{ cilium_namespace }}"
    chart_version: "{{ cilium_chart_version }}"
    kubeconfig: "{{ kubeconfig }}"
    values: "{{ cilium_config | from_yaml }}"
  register: cilium_install
  notify: Wait for Cilium to be ready

- name: Restart Cilium operator
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: cilium-operator
    namespace: kube-system
    kubeconfig: "{{ kubeconfig }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_facts['date_time']['iso8601'] }}"
  when:
    - cilium_install.changed
    - cilium_install.status.revision | int > 1

- name: Restart Cilium agents
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: DaemonSet
    name: cilium
    namespace: kube-system
    kubeconfig: "{{ kubeconfig }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_facts['date_time']['iso8601'] }}"
  when:
    - cilium_install.changed
    - cilium_install.status.revision | int > 1
