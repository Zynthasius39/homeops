---
- name: Import Cilium tasks
  ansible.builtin.include_tasks: "{{ cilium_task.file }}"
  loop:
    - file: gateway-api.yml
      enabled: "{{ cilium_gateway_api_enabled }}"
    - file: cilium.yml
    - file: other.yml
    - file: l2.yml
      enabled: "{{ cilium_l2_announcements_enabled }}"
    - file: bgp.yml
      enabled: "{{ cilium_bgp_enabled }}"
  loop_control:
    loop_var: cilium_task
  when: cilium_enabled and (cilium_task.enabled | default(true))
