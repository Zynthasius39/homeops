---
- name: Import Cilium tasks
  ansible.builtin.include_tasks: "{{ item.file }}"
  loop:
    - file: gateway-api.yml
      enabled: "{{ cilium_gateway_api_enabled }}"
    - file: cilium.yml
    - file: other.yml
    - file: l2.yml
      enabled: "{{ cilium_l2_announcements_enabled }}"
    - file: bgp.yml
      enabled: "{{ cilium_bgp_enabled }}"
  when: cilium_enabled and (item.enabled | default(true))
