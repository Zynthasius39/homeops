---
- name: Deploy Cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: "{{ cilium_chart_registry }}"
    release_namespace: kube-system
    chart_version: "{{ cilium_chart_version }}"
    kubeconfig: "{{ kubeconfig_path }}"
    values:
      autoDirectNodeRoutes: true
      hostFirewall.enabled: true
      ipam.mode: kubernetes
      kubeProxyReplacement: "true"
      k8sServiceHost: "{{ hostvars[groups['server'][0]]['ansible_host'] }}"
      k8sServicePort: "6443"
      l2announcements.enabled: true
      routingMode: native
      ipv4NativeRoutingCIDR: "{{ hostvars[groups['server'][0]]['cluster_cidr'] }}"
  when: hostvars[groups['server'][0]]['enable_cilium']

- name: Create manifests needed for Cilium
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
    - "cilium-lb-ip-pool.yaml"
  when: hostvars[groups['server'][0]]['enable_cilium']
