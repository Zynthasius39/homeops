---
- name: "{{ ansible_role_name }}/root: Unlock the USB Vault"
  ansible.builtin.include_role:
    name: usb-vault
    tasks_from: unlock.yml
    apply:
      tags: [always]
  when: not (ansible_facts["mounts"] | selectattr('mount', 'equalto', usb_mount_dir) | list | length > 0)
  tags: [always]

# 1. Health Checks
- name: "{{ ansible_role_name }}/status: Check expiration and health"
  ansible.builtin.include_tasks:
    file: status.yml
    apply:
      tags: [pki_status, pki_all]
  tags: [pki_status, pki_all]

# 2. Root CA (Gated for safety)
- name: "{{ ansible_role_name }}/root: Root CA lifecycle"
  ansible.builtin.include_tasks:
    file: root.yml
    apply:
      tags: [pki_root]
  tags: [pki_root]

# 3. Intermediate CA
- name: "{{ ansible_role_name }}/ica: Intermediate CA lifecycle"
  ansible.builtin.include_tasks:
    file: intermediate.yml
    apply:
      tags: [pki_intermediate, pki_all]
  loop:
    - acme
    - infra
    - vpn
  loop_control:
    loop_var: ica
  tags: [pki_intermediate, pki_all]

# 4. Container Deployment
- name: "{{ ansible_role_name }}/step-ca: Infrastructure deployment"
  ansible.builtin.include_tasks:
    file: step-ca.yml
    apply:
      tags: [pki_infra, pki_all]
  vars:
    quadlet_container_name: step-ca
    quadlet_mount_src:
      - "{{ _quadlet.data ~ '/etc/' }}"
    quadlet_cpus: 1
    quadlet_memory: 256M
  tags: [pki_infra, pki_all]
