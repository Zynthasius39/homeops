---
- name: "{{ ansible_role_name }}/root: Unlock the USB Vault"
  ansible.builtin.include_role:
    name: usb-vault
    tasks_from: unlock.yml
    apply:
      tags: [always]
  when: not (ansible_facts["mounts"] | selectattr('mount', 'equalto', usb_mount_dir) | list | length > 0)
  tags: [pki_status, pki_root, pki_intermediate, pki_acme, pki_all]

- name: "{{ ansible_role_name }}/status: Check expiration and health"
  ansible.builtin.include_tasks:
    file: status.yml
    apply:
      tags: [pki_status, pki_all]
  tags: [pki_status, pki_all]

- name: "{{ ansible_role_name }}/root: Root CA lifecycle"
  ansible.builtin.include_tasks:
    file: root.yml
    apply:
      tags: [pki_root, pki_acme, pki_all]
  tags: [pki_root, pki_acme, pki_all]

- name: "{{ ansible_role_name }}/ica: Intermediate CA lifecycle"
  ansible.builtin.include_tasks:
    file: intermediate.yml
    apply:
      tags: [pki_intermediate, pki_acme, pki_all]
  loop:
    - acme
    - infra
    - vpn
  loop_control:
    loop_var: ica
  tags: [pki_intermediate, pki_acme, pki_all]

- name: "{{ ansible_role_name }}/step-ca: Infrastructure deployment"
  ansible.builtin.include_tasks:
    file: step-ca.yml
    apply:
      tags: [pki_acme, pki_all]
  vars:
    ica: acme
    quadlet_container_name: step-ca
    quadlet_mount_src:
      - "{{ _quadlet.data ~ '/data/' }}"
    quadlet_cpus: 1
    quadlet_memory: 256M
  tags: [pki_acme, pki_all]

- name: "{{ ansible_role_name }}/server: Server certificate lifecycle"
  ansible.builtin.include_tasks:
    file: server.yml
    apply:
      tags: [pki_server, pki_all]
  vars:
    ica: infra
  loop:
    - common_name: argocd.naquadah.alak
  loop_control:
    loop_var: server
  tags: [pki_server, pki_all]
