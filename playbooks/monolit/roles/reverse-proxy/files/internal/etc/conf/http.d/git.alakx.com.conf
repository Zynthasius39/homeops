# ------------------------------------------------------------
# git.alakx.com
# ------------------------------------------------------------

map $scheme $hsts_header {
  https "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "10.0.50.31";
  set $port           3000;

  listen 80;
  listen [::]:80;

  server_name git.alakx.com;
  access_log /var/log/angie/git.alakx.com.access.log proxy;
  error_log /var/log/angie/git.alakx.com.error.log warn;

  include conf/http.d/include/cloudflare.conf;

  location / {
    client_max_body_size 512M;
    proxy_set_header Connection $http_connection;
    proxy_set_header Upgrade $http_upgrade;
    include conf/http.d/include/proxy.conf;
  }
}
