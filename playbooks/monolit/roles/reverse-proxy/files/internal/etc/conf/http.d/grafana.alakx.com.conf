# ------------------------------------------------------------
# grafana.alakx.com
# ------------------------------------------------------------

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $scheme $hsts_header {
  https "max-age=63072000; preload";
}

server {
  set $forward_scheme http;
  set $server         "10.0.50.91";
  set $port           3000;

  listen 80;
  listen [::]:80;

  server_name grafana.alakx.com;
  access_log /var/log/angie/grafana.alakx.com.access.log proxy;
  error_log /var/log/angie/grafana.alakx.com.error.log warn;
  proxy_buffering off;

  include conf/http.d/include/cloudflare.conf;

  location / {
    include conf/http.d/include/proxy.conf;
  }

  location /api/live/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include conf/http.d/include/proxy.conf;
  }

  status_zone $host zone=host_zone:10;
}
