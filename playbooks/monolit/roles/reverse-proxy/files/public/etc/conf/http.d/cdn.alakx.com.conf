# ------------------------------------------------------------
# cdn.alakx.com
# ------------------------------------------------------------

map $scheme $hsts_header {
  https "max-age=63072000; preload";
}

server {
  listen 80;
  listen [::]:80;

  listen 443 ssl;
  listen [::]:443 ssl;
  acme letsenc;

  root /usr/share/angie/cdn;

  server_name cdn.alakx.com;
  access_log /var/log/angie/cdn.home.alak.access.log proxy;
  error_log /var/log/angie/cdn.home.alak.error.log warn;

  location / {
    # autoindex on;
  }

  location /hdd/ {
    # autoindex on;
    alias /usr/share/angie/hdd/;
  }

  location /csgo/ {
    alias /usr/share/angie/fastdl/csgo/;
  }

  status_zone $host zone=host_zone:10;
}

