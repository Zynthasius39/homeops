---
- name: "Telemetry/prometheus: Create volume directories"
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: "{{ _quadlet.owner }}"
    group: "{{ _quadlet.group }}"
    mode: "0755"
  loop: "{{ _quadlet.mount_src }}"

- name: "Telemetry/prometheus: Generate quadlets"
  containers.podman.podman_container:
    name: "{{ _quadlet.name }}"
    state: quadlet
    quadlet_dir: "{{ _quadlet.quadlet_dir }}"
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volume:
      - "{{ _quadlet.mount_src[0] }}:/etc/prometheus.yaml:Z"
    image: "{{ _quadlet.image }}"
    dns: "{{ _quadlet.dns }}"
    network: "{{ _quadlet.network }}"
    ip: "{{ _quadlet.ip }}"
    mac_address: "{{ _quadlet.mac_address }}"
    cpus: "{{ _quadlet.cpus }}"
    memory: "{{ _quadlet.memory }}"
    quadlet_options:
      - "AutoUpdate=registry"
      - |

        {{ _quadlet.__systemd_service }}
        {{ _quadlet.__systemd_unit }}
        {{ _quadlet.__systemd_install.rstrip() }}
  vars:
    systemd_service:
      Restart: always
    systemd_unit:
      After:
        - telemetry.target
    systemd_install:
      WantedBy:
        - telemetry.target
  register: quadlet_gen
  notify: "SystemD daemon reload"

- name: "Telemetry/prometheus: Render etc"
  ansible.builtin.template:
    src: prometheus.yaml.j2
    dest: "{{ _quadlet.mount_src[0] }}"
    mode: '0644'
  vars:
    config: "{{ services[ansible_role_name].config }}"
  register: render_etc

- name: "Telemetry/prometheus: Run notified handlers now"
  ansible.builtin.meta: flush_handlers

- name: "Telemetry/prometheus: Check if service is running"
  ansible.builtin.systemd:
    name: "{{ _quadlet.name }}.service"
  register: service_status
  when: >
    [
      quadlet_gen,
      render_etc
    ] | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0

- name: "Telemetry/prometheus: Restart if service was running"
  ansible.builtin.service:
    name: "{{ _quadlet.name }}.service"
    state: restarted
  register: service_restart
  when: >
    (
      [
        quadlet_gen
      ] | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0
    ) and service_status.status is defined
      and service_status.status.ActiveState == "active"

- name: "Telemetry/prometheus: Reload if service was running"
  containers.podman.podman_container_exec:
    name: "{{ _quadlet.name }}"
    command: killall -HUP prometheus
  when: >
    (
      [
        render_etc
      ] | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0
    ) and service_status.status is defined
      and service_status.status.ActiveState == "active"
      and not service_restart.changed
