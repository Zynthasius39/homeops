---
- name: "USB-Vault/lock: Load USB device path"
  ansible.builtin.include_tasks: device.yml

- name: "USB-Vault/lock: Safely close the LUKS container"
  become: true
  block:
    - name: "USB-Vault/lock: Unmount the LUKS container"
      ansible.posix.mount:
        path: "{{ usb_mount_dir }}"
        state: unmounted

    - name: "USB-Vault/lock: Close the LUKS container"
      community.crypto.luks_device:
        device: "{{ '/dev/disk/by-uuid/' ~ usb_uuid | default(usb_device) }}"
        state: closed
